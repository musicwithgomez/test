<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goldmine Backtest Lab</title>

<style>
/* chart series colours: validated (lightness band, CVD separation, contrast) against each theme's panel colour */
:root,:root[data-theme=light]{--s1:#1f7fd6;--s2:#c46c00;--s3:#7a4fd0}
:root[data-theme=dark],:root[data-theme=midnight]{--s1:#3a86d4;--s2:#c4761c;--s3:#8a6bd4}
body{min-height:100%}
.jtop{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;height:56px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em;font-size:15px;white-space:nowrap;text-decoration:none;color:inherit}
.brand svg{width:26px;height:26px}
.brand span{font-size:9.5px;font-weight:800;color:var(--acc);background:var(--accbg);padding:2px 6px;border-radius:5px;letter-spacing:.08em}
.jtop select,.fld select,.fld input,.ctl select,.ctl input{height:32px;padding:0 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:12px;font-weight:600;min-width:0}
.tabsj{position:sticky;top:56px;z-index:19;display:flex;gap:2px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabsj button{height:42px;padding:0 13px;color:var(--mut);font-weight:700;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.tabsj button:hover{color:var(--text)}.tabsj button.on{color:var(--text);border-bottom-color:var(--acc)}
.tabsj button:disabled{opacity:.4;cursor:default}
main{padding:14px;display:flex;flex-direction:column;gap:14px;max-width:1500px;margin:0 auto}
main>*{min-width:0}
.card h5{font-size:12.5px}
.card h5 small{font-weight:600;color:var(--mut);font-size:11px}
.sub{color:var(--mut);font-size:12px;margin:-4px 0 10px}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px 16px}
.fld{display:grid;gap:4px;font-size:11.5px;color:var(--mut);font-weight:700;align-content:start}
.fld small{font-weight:500}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:28px;padding:0 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;color:var(--mut)}
.chips button.on{background:var(--accbg);color:var(--acc);border-color:var(--accline)}
.chips button:disabled{opacity:.35;cursor:default}
.runbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.runbar .btn.acc{height:36px;padding:0 18px;font-size:13px}
.prog{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;flex:1;min-width:140px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.note{font-size:11.5px;color:var(--mut)}
.notes{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.notes div{font-size:11.5px;color:var(--orange)}
details.sum{display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0}
details.sum>summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700}
details.sum>summary::-webkit-details-marker{display:none}
details.sum>summary .mut{font-weight:600}
details.sum>summary .chev{margin-left:auto;color:var(--mut);font-size:11px}
details.sum[open]>summary{border-bottom:1px solid var(--line)}
details.sum>.in{padding:12px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kgrid .kpi b{font-size:17px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g2>*{min-width:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.g3>*{min-width:0}
.pick{border:1.5px solid var(--accline);background:linear-gradient(180deg,var(--accbg),var(--panel) 70%)}
.pick .lab{font-size:11px;font-weight:800;color:var(--acc);letter-spacing:.06em;text-transform:uppercase}
.pick h2{font-size:22px;letter-spacing:-.02em;margin:4px 0 2px}
.pick .exit{font-size:14px;font-weight:700;margin-bottom:12px}
.pick .exit span{color:var(--mut);font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.why{display:flex;flex-direction:column;gap:6px;font-size:12.5px;padding:0;margin:0;list-style:none}
.why li{display:flex;gap:8px}.why li i{font-style:normal;width:18px;flex:none;text-align:center}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:7px;font-size:12.5px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:8px}.steps li::before{content:counter(s);flex:none;width:19px;height:19px;border-radius:50%;background:var(--accbg);color:var(--acc);font-weight:800;font-size:11px;display:grid;place-items:center}
.steps .man{color:var(--orange);font-weight:700}
.ins{display:flex;gap:11px;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.ins+.ins{margin-top:8px}
.ins .ic{width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:16px;background:var(--panel2)}
.ins.good .ic{background:var(--upbg)}.ins.bad .ic{background:var(--dnbg)}.ins.warn .ic{background:rgba(230,150,20,.15)}
.ins b{font-size:12.5px}.ins p{color:var(--mut);font-size:12px;margin-top:2px}
.ins .imp{margin-left:auto;font-weight:800;font-size:12.5px;white-space:nowrap;align-self:center;padding-left:6px}
.twrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.twrap.tall{max-height:560px}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.click{cursor:pointer}
.tbl tr.on td{background:var(--accbg)}
.tbl td.wrap{white-space:normal;min-width:180px}
.ok{color:var(--up);font-weight:800}.no{color:var(--mut)}
.htbl{border-collapse:separate;border-spacing:3px;width:100%;font-size:12px}
.htbl th{font-size:11px;color:var(--mut);font-weight:700;text-align:center;padding:4px 6px;white-space:nowrap}
.htbl th.rh{text-align:left}
.htbl td{padding:7px 6px;border-radius:7px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--panel2)}
.htbl td.rh{background:none;text-align:left;font-weight:700;padding-left:0}
.htbl td.c{cursor:pointer}.htbl td.c:hover{box-shadow:inset 0 0 0 1.5px var(--line2)}
.htbl td.sel{box-shadow:inset 0 0 0 2px var(--acc)!important}
.htbl td small{display:block;font-size:10px;color:var(--mut);font-weight:600}
.htbl td.thin{opacity:.45}
.htbl td.na{background:none;color:var(--dim)}
.bars{display:flex;flex-direction:column;gap:5px}
.brow{display:grid;grid-template-columns:minmax(90px,170px) 1fr 82px;gap:10px;align-items:center;font-size:12px}
.brow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow span small{color:var(--mut);font-size:10.5px}
.brow .bt{height:10px;border-radius:5px;background:var(--panel2);position:relative}
.brow .bt i{position:absolute;top:0;bottom:0;border-radius:3px}
.brow .bt i.mid{left:50%;width:1px;top:-3px;bottom:-3px;background:var(--line2);border-radius:0}
.brow b{text-align:right;font-variant-numeric:tabular-nums}
.brow.thin{opacity:.5}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible;touch-action:none}
.chart text{font:600 10.5px var(--font);fill:var(--mut)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11.5px;box-shadow:var(--shadow);white-space:nowrap;z-index:5;display:none;line-height:1.45}
.tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legendx{display:flex;gap:14px;font-size:11.5px;color:var(--mut);flex-wrap:wrap;margin-bottom:6px}
.legendx i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ctl .lab{font-size:11px;font-weight:700;color:var(--mut)}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.selbar .lab{font-size:11px;font-weight:700;color:var(--mut)}
.selbar select{max-width:320px}
.banner{padding:12px 14px;border-radius:11px;font-size:13.5px;font-weight:700;border:1px solid var(--line);background:var(--panel2)}
.banner.up{background:var(--upbg);border-color:transparent;color:var(--text)!important}
.banner.dn{background:var(--dnbg);border-color:transparent;color:var(--text)!important}
.banner small{display:block;font-weight:600;color:var(--mut);font-size:12px;margin-top:3px}
.empty-big{padding:50px 20px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.method{font-size:12.5px;color:var(--mut);display:grid;gap:7px}
.method b{color:var(--text)}
.pill{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.pill.ok{background:var(--upbg);color:var(--up);border-color:transparent}
.pill.warn{background:rgba(230,150,20,.15);color:var(--orange);border-color:transparent}
@media (max-width:1000px){.g2,.g3,.cols{grid-template-columns:1fr}}
@media (max-width:640px){.card{overflow-x:auto}.ctl .seg,.selbar .seg{flex-wrap:wrap;max-width:100%;flex:0 1 auto}.selbar select{max-width:100%}#themeSeg,.hide-sm{display:none!important}.jtop{padding:0 10px}main{padding:10px}.brand b{display:none}.brow{grid-template-columns:90px 1fr 70px}.pick h2{font-size:18px}}
</style>
<style id="labBrand">
/* ===== Goldmine brand look: the landing page's deep navy + gold, in all three themes ===== */
:root{--gold1:#ffd982;--gold2:#f5b73b;--gold3:#e0960c;--goldg:linear-gradient(135deg,#f9c95a,#e0960c);--ink:#1a1203}
:root[data-theme=light]{--acc:#b97d0c;--accbg:#fbf1da;--accline:#e9c66f;--acctx:#1a1203;--glow:rgba(224,150,12,.11);--card1:#ffffff;--card2:#fcfbf7;--grid:rgba(20,26,36,.05)}
:root[data-theme=dark]{--acc:#e8ac3c;--accbg:rgba(232,172,60,.13);--accline:rgba(232,172,60,.42);--acctx:#1a1203;--glow:rgba(232,172,60,.12);--card1:#2a3138;--card2:#252b31;--grid:rgba(255,255,255,.035)}
:root[data-theme=midnight]{--glow:rgba(245,183,59,.15);--card1:#121722;--card2:#0e121a;--grid:#141a24}
html,body{background:var(--bg)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(760px 440px at 88% -8%,var(--glow),transparent 70%),radial-gradient(560px 400px at -5% 0%,rgba(22,199,132,.06),transparent 70%)}
body>*{position:relative;z-index:1}#toasts{position:fixed;z-index:70}
.jtop{background:color-mix(in srgb,var(--panel) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:color-mix(in srgb,var(--line) 70%,transparent)}
.brand span{background:var(--goldg);color:var(--ink);box-shadow:0 6px 18px -8px rgba(245,183,59,.8)}
.tabsj{top:56px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);gap:6px;padding:9px 14px;align-items:center}
.tabsj button{height:34px;border:1px solid var(--line);border-radius:999px;padding:0 15px 0 5px;display:flex;align-items:center;gap:8px;background:var(--panel);font-size:12.5px;transition:background .15s,box-shadow .15s}
.tabsj button i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.tabsj button:hover:not(:disabled){border-color:var(--accline)}
.tabsj button.on{background:var(--goldg);color:var(--ink);border-color:transparent;box-shadow:0 10px 26px -12px rgba(245,183,59,.75)}
.tabsj button.on i{background:rgba(26,18,3,.16);color:var(--ink);border-color:transparent}
.tabsj .exp{border-color:var(--accline);color:var(--acc);padding:0 15px;background:var(--accbg)}
main{max-width:1440px;gap:16px}
.hero{padding:22px 2px 4px;position:relative;isolation:isolate}
.hero::after{content:'';position:absolute;inset:-40px -20px -10px;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 30% 30%,#000 15%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 30% 30%,#000 15%,transparent 70%)}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.hero .eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(22,199,132,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(22,199,132,0)}100%{box-shadow:0 0 0 0 rgba(22,199,132,0)}}
.hero h1{font-size:clamp(30px,4.6vw,54px);line-height:1.02;font-weight:900;letter-spacing:-.045em;margin:10px 0 10px;color:var(--text)}
.hero h1 span{background:linear-gradient(90deg,var(--gold1),var(--gold2) 45%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:15px;max-width:780px;line-height:1.55}
.hstats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hstats div{padding:11px 18px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card1),var(--card2));min-width:128px;box-shadow:0 14px 40px -30px rgba(0,0,0,.7)}
.hstats b{display:block;font-size:23px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hstats small{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.card,details.sum{background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--line);border-radius:16px;box-shadow:0 22px 60px -42px rgba(0,0,0,.75)}
.card{padding:16px 18px}
.card h5{font-size:13.5px;font-weight:850;letter-spacing:-.01em;margin-bottom:12px}
details.sum>summary{padding:13px 16px}
details.sum>summary .chev{color:var(--acc);font-weight:800}
.kpi{background:color-mix(in srgb,var(--panel2) 80%,transparent);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.kpi small{text-transform:uppercase;letter-spacing:.07em;font-size:10px;font-weight:800}
.kgrid .kpi b{font-size:21px;font-weight:900;letter-spacing:-.03em}
.pick{position:relative;overflow:hidden;border:1px solid rgba(245,183,59,.5);padding:22px 22px 20px;background:radial-gradient(760px 280px at 0% 0%,rgba(245,183,59,.18),transparent 60%),linear-gradient(180deg,var(--card1),var(--card2));box-shadow:0 34px 90px -44px rgba(224,150,12,.6),inset 0 1px 0 rgba(255,217,130,.1)}
.pick::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.pick .lab{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--goldg);color:var(--ink);font-size:10.5px;letter-spacing:.08em}
.pick h2{font-size:clamp(24px,3.2vw,34px);font-weight:900;letter-spacing:-.035em;margin:12px 0 4px}
.pick .exit{font-size:15px}
.btn{border-radius:10px}
.btn.acc{background:var(--goldg);color:var(--ink);border:0;box-shadow:0 10px 26px -12px rgba(245,183,59,.7);font-weight:800}
.btn.acc:hover{filter:brightness(1.07)}
.runbar{padding-top:14px;border-top:1px solid var(--line);margin-top:14px}
.runbar .btn.acc{height:44px;padding:0 24px;font-size:14.5px;border-radius:12px}
.prog{height:8px;border-radius:999px}.prog i{background:linear-gradient(90deg,#e0960c,#ffd982,#e0960c);background-size:200% 100%;animation:shim 1.3s linear infinite;border-radius:999px}
@keyframes shim{to{background-position:-200% 0}}
.chips button{transition:background .12s}.chips button.on{background:var(--goldg);color:var(--ink);border-color:transparent}
.fld select,.fld input,.ctl select,.ctl input,.selbar select,.jtop select{border-radius:10px;background:var(--panel2)}
.ins{border-left:3px solid var(--line2);background:color-mix(in srgb,var(--panel2) 80%,transparent)}
.ins.good{border-left-color:var(--up)}.ins.bad{border-left-color:var(--dn)}.ins.warn{border-left-color:var(--orange)}.ins.info{border-left-color:var(--accline)}
.twrap{border-radius:12px;background:transparent}
.tbl th{text-transform:uppercase;letter-spacing:.06em;font-size:9.5px;background:var(--panel2)}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--acc) 7%,transparent)}
.tbl tr.on td{background:color-mix(in srgb,var(--acc) 13%,transparent)}
.htbl td{border-radius:9px;border:1px solid color-mix(in srgb,var(--text) 5%,transparent)}
.htbl td.c:hover{box-shadow:inset 0 0 0 1.5px var(--accline)}
.htbl td.sel{box-shadow:inset 0 0 0 2px var(--acc),0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)!important}
.selbar{border-radius:14px;background:linear-gradient(180deg,var(--card1),var(--card2));padding:11px 14px}
.banner{border-radius:14px;padding:14px 16px}
.banner.up{background:linear-gradient(135deg,color-mix(in srgb,var(--up) 20%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--up) 35%,transparent)}
.banner.dn{background:linear-gradient(135deg,color-mix(in srgb,var(--dn) 20%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--dn) 35%,transparent)}
.pill{border-radius:999px}
.focusbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:14px;border-radius:12px;border:1px solid var(--accline);background:var(--accbg);font-size:12.5px}
.focusbar b{color:var(--text)}
.focuscard{border:1px solid var(--accline)}
.focuscard .lab{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.focuscard h3{font-size:16px;letter-spacing:-.01em;margin:4px 0 12px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.cols3>div{padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.cols3 small{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.cols3 b{font-size:23px;font-weight:900;letter-spacing:-.03em}
.cols3 span{font-size:12px;color:var(--mut)}
.cols3 .hl{border-color:var(--accline);background:var(--accbg)}
.explist{display:grid;gap:8px}
.explist button{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
.explist button:hover{border-color:var(--accline);background:var(--accbg)}
.explist b{font-size:13px}.explist span{font-size:12px;color:var(--mut);line-height:1.45}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.feat{padding:16px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card1),var(--card2))}
.feat i{font-style:normal;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--accbg);border:1px solid var(--accline);margin-bottom:10px}
.feat b{display:block;font-size:14px;letter-spacing:-.01em;margin-bottom:4px}.feat p{font-size:12.5px;color:var(--mut);line-height:1.5}
.chart .area{opacity:.9}
@media (max-width:900px){.cols3{grid-template-columns:1fr}}
@media (max-width:640px){.hero h1{font-size:30px}.hstats div{min-width:0;flex:1 1 40%}.tabsj button{padding:0 12px 0 4px}}
</style>
</head>

/* =====================================================================
   GOLDMINE BACKTEST LAB — the TR1 / TR2 system tested the way you really trade it.

   Signals: trScan() from gp-shared.js (the SAME code as the live chart and the auto-trade bot).
   Every signal is then traded hundreds of ways (take profit × stop management × partials) on the real candles:
     · costs: each candle's own MT5 spread (+ commission), buys pay the ask, sells exit on the ask
     · precise fills: higher-timeframe trades are replayed on lower-timeframe candles where that data exists
     · fill-then-stop: a candle that fills the limit AND closes beyond the stop is counted as the −1R it really is

       breakeven / trailing moves only count from the NEXT candle

/* =====================================================================
   1. EXIT PLANS: take profit × stop management × partial close
   ===================================================================== */

    if (tp.k === 'R' && ((sm.k === 'be' && sm.r >= tp.r) || (pt.k === 'part' && pt.r >= tp.r))) continue; // would be identical to the plain version
    out.push({ key: `${tp.id}|${sm.id}|${pt.id}`, tp, sm, pt });

}
const planLabel = p => !p ? '—' : [p.tp.l, p.sm.k === 'fix' ? '' : p.sm.l, p.pt.k === 'none' ? '' : p.pt.l].filter(Boolean).join(' · ');
const planOf = (tf, key) => { const D = LAB.D[tf]; return D && D.pidx[key] != null ? D.plans[D.pidx[key]] : null };
const EXN = ['still open', 'stop loss', 'breakeven stop', 'trailing stop', 'take profit', 'opposite signal', 'time limit'];
const EX = { OPEN: 0, STOP: 1, BE: 2, TRAIL: 3, TP: 4, SIG: 5, TIME: 6 };

/* =====================================================================
   2. DATA: candles per timeframe -> TR setups -> trades, zones, breaks
   ===================================================================== */
/* ---------- candle data: saved in this browser (IndexedDB), downloaded in small pages, or imported from CSV files ----------
   The bridge is shared with the terminal and the bot: a later run only downloads the candles that are new since the last one,
   a first download goes in pages of 20,000 with a pause between them, and "Imported files only" never touches the bridge. */
const IDB = {
  db: null,
  open() { return this.db ||= new Promise((res, rej) => { const r = indexedDB.open('goldmine-lab', 1); r.onupgradeneeded = () => r.result.createObjectStore('candles'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error) }) },
  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('candles', mode), st = t.objectStore('candles'), q = fn(st); t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error) }) },
  async get(k) { try { return (await this.tx('readonly', s => s.get(k))) || null } catch { return null } },
  async set(k, v) { try { await this.tx('readwrite', s => s.put(v, k)) } catch (e) { LAB.notes.push('Could not save the candles in this browser: ' + e.message) } },
  async del(k) { try { await this.tx('readwrite', s => s.delete(k)) } catch {} },
  async keys() { try { return (await this.tx('readonly', s => s.getAllKeys())) || [] } catch { return [] } },
};
const ckey = tf => (CFG.demo ? 'demo|' : '') + LAB.symbol + '|' + tf;
const apiCandles = (tf, n, start = 0) => api(`/api/candles?login=${LAB.login}&symbol=${enc(LAB.symbol)}&timeframe=${tf}&count=${n}&spread=1${start ? '&start=' + start : ''}`);
async function getCandles(tf, count, say) {
  const key = ckey(tf), sec = TF_SEC[tf], cached = await IDB.get(key);
  if (OPT.source === 'files') { if (!cached?.candles?.length) throw new Error('no saved or imported candles (import a CSV or switch the data source to MT5)'); return { ...cached, candles: cached.candles.slice(-count), src: cached.src || 'saved' } }
  if (cached?.candles?.length && !LAB.fresh && (cached.candles.length >= count || cached.full)) { // top up: only the candles that are new since the last run
    const last = cached.candles[cached.candles.length - 1].time, need = Math.max(5, Math.ceil((Date.now() / 1000 + GP.off + 3600 - last) / sec) + 5);
    if (need <= 20000) {
      say?.(`${tf}: ${cached.candles.length.toLocaleString()} candles saved in this browser, downloading the ${need.toLocaleString()} newest…`);
      const r = await apiCandles(tf, need), nc = r.candles || [];
      const merged = nc.length ? cached.candles.filter(c => c.time < nc[0].time).concat(nc) : cached.candles;
      const keep = merged.slice(-Math.max(count, cached.candles.length)); await IDB.set(key, { ...cached, candles: keep, at: Date.now(), digits: r.digits ?? cached.digits, point: r.point || cached.point });
      return { candles: keep.slice(-count), digits: r.digits ?? cached.digits, point: r.point || cached.point, src: 'saved + new' };
    }

  while (got < count) {
    const n = Math.min(20000, count - got); say?.(`${tf}: downloading candles ${(got + 1).toLocaleString()}–${(got + n).toLocaleString()} of ${count.toLocaleString()} from MT5…`);
    const r = await apiCandles(tf, n, start), c = r.candles || []; digits = r.digits ?? digits; point = r.point || point;
    if (!c.length) { full = true; break }                                                                      // the start of the broker's history
    if (pages.length && c[c.length - 1].time >= pages[pages.length - 1][0].time) { LAB.capped = true; break }    // an older bridge ignores paging: 20,000 max
    pages.push(c); got += c.length; start += c.length;

  }

// MT5 "Export bars" CSV (<DATE> <TIME> <OPEN> <HIGH> <LOW> <CLOSE> <TICKVOL> <VOL> <SPREAD>) or any time,open,high,low,close[,spread] file
function parseCsv(text, name) {

  const iO = hasHead ? ix('open') : mt5 ? 2 : 1, iH = hasHead ? ix('high') : iO + 1, iL = hasHead ? ix('low') : iO + 2, iC = hasHead ? ix('close') : iO + 3, iS = hasHead ? ix('spread') : mt5 ? 8 : -1;
  const iT = hasHead ? [ix('time'), ix('timestamp'), ix('datetime'), ix('date')].find(i => i >= 0) : 0;

  const out = [];

    const f = lines[i].split(delim), t = mt5 ? ts(`${f[hasHead ? ix('date') : 0]} ${f[hasHead ? ix('time') : 1]}`) : ts(f[iT]), b = { time: t, open: +f[iO], high: +f[iH], low: +f[iL], close: +f[iC] };
    if (iS >= 0 && f[iS] != null && f[iS] !== '') b.spread = +f[iS];

  for (const k of ks) { const v = await IDB.get(k); if (v?.candles?.length) out[k.slice(pre.length)] = { n: v.candles.length, from: v.candles[0].time, to: v.candles[v.candles.length - 1].time, at: v.at, src: v.src } }

async function clearSaved() { if (!(await confirmBox('Delete the saved candles?', `<p>All candles of ${esc(LAB.symbol)} saved in this browser are deleted. The next run downloads them from MT5 again.</p>`, 'Delete', 'danger'))) return; for (const tf of Object.keys(LAB.saved || {})) await IDB.del(ckey(tf)); await refreshSaved(); render() }
// the settings finder in the terminal sent one exact setting: test it on the timeframes around it
const around = tf => { const L = tf === 'M3' ? ['M1', 'M3', 'M5', 'M15', 'M30', 'H1', 'H4', 'D1'] : ['M1', 'M5', 'M15', 'M30', 'H1', 'H4', 'D1'], i = L.indexOf(tf); return L.slice(Math.max(0, i - 2), i + 3) };
const LAB_SESS = { all: () => true, ln: h => h >= 7 && h < 21, lo: h => h >= 7 && h < 16, ny: h => h >= 12 && h < 21, as: h => h >= 21 || h < 7 }; // same as the finder (UTC hour of the fill)
const focusOk = tr => { const f = LAB.focus; return !f || ((!f.dir || f.dir === 'b' || (f.dir === 'l' ? tr.dir > 0 : tr.dir < 0)) && (LAB_SESS[f.sess || 'all'] || LAB_SESS.all)(tr.uh)) };

async function clearFocus() { LAB.focus = null; store.set('labFocus', null); if (LAB.cand) { LAB.idxC = new Map(); await buildCand(); pickDefaults() } render() }
async function loadSpec() {
  try { const r = await api(`/api/live?login=${LAB.login}&symbol=${enc(LAB.symbol)}&timeframe=M1`); LAB.spec = { point: r.point, digits: r.digits, contract: r.contract, tickValue: r.tick_value, tickSize: r.tick_size, spread: r.ask && r.bid ? r.ask - r.bid : 0 }; LAB.digits = r.digits ?? LAB.digits; LAB.point = r.point || LAB.point }

function buildTF(tf, C, cfg) {
  const sec = TF_SEC[tf], n = C.length, A = trAtrA(C), T = new Float64Array(n);
  for (let i = 0; i < n; i++) T[i] = C[i].time;

  const spr = new Float32Array(n), pt = LAB.point, fb = LAB.sprFb * pt; let real = 0; const sv = [];

/* ---------- precise fills: replay on the finest lower-timeframe candles that cover the trade (≥ 1/60 of its timeframe) ---------- */
function pathOf(tr) {

  return { n, runs, dd50: pc(dds, .5), dd95: pc(dds, .95), dd99: pc(dds, .99), fin5: pc(fins, .05), fin50: pc(fins, .5), fin95: pc(fins, .95), st95: pc(sts, .95), pDD10: dds.filter(x => x * risk >= 10).length / runs, pDD20: dds.filter(x => x * risk >= 20).length / runs, pass: pass / runs, fail: fail / runs, passMed: passN.length ? pc(passN, .5) : 0 };
}

function methodCard() {

    <div><b>Precise fills</b>: a trade on a higher timeframe is replayed on the smallest loaded candles that cover it (at least 1/60 of its timeframe, e.g. H1 on M1, H4 on M5), so "what came first, the stop or the target" is known instead of guessed.</div>

      rows.push([tf, iso(t.tFill), t.tr, t.dir > 0 ? 'buy' : 'sell', t.entry, t.sl, r3(t.risk), r3(t.atrR), t.bars, t.wait, t.uh, t.wd, t.kill ? 1 : 0, t.path, r3(t.mfe), r3(t.costR), ...htf.map(z => t.al[z] ?? ''), ...KEY_PLANS.map(R), bk ? planLabel(D.plans[bi]).replace(/,/g, ' ') : '', bk ? R(bk) : '']) });
  }
  dl(`goldmine-lab-trades-${LAB.sym}-${stamp()}.csv`, rows.map(r => r.join(',')).join('\n'), 'text/csv');
}
function exportResults() {
  const rows = [['timeframe', 'signals', 'filter', 'exit_key', 'exit', 'trades', 'win_pct', 'R_per_trade', 'total_R', 'profit_factor', 'max_dd_R', 'loss_streak', 'confidence', 'R_per_month', 'seen_trades', 'seen_R_per_trade', 'unseen_trades', 'unseen_R_per_trade', 'quarters_positive', 'robust']];
  for (const x of [...LAB.cand].sort((a, b) => b.score - a.score)) rows.push([x.tf, gLabel(x.g), x.f, x.key.replace(/,/g, ' '), planLabel(LAB.D[x.tf].plans[x.p]).replace(/,/g, ' '), x.n, x.win.toFixed(1), x.avg.toFixed(3), x.sum.toFixed(2), x.pf.toFixed(2), x.dd.toFixed(2), x.streak, x.t.toFixed(2), x.rpm.toFixed(2), x.isN, x.isAvg.toFixed(3), x.oosN, x.oosAvg.toFixed(3), `${x.qp}/${x.qa}`, x.rob ? 1 : 0]);
  dl(`goldmine-lab-results-${LAB.sym}-${stamp()}.csv`, rows.map(r => r.join(',')).join('\n'), 'text/csv');
}
function summaryText() {
  const L = [], b = LAB.best, P = (x, l) => x ? `${l}: ${x.n} trades, win ${x.win.toFixed(0)}%, ${fR(x.avg)} per trade, total ${fR(x.sum, 1)}, max DD −${x.dd.toFixed(1)}R, unseen ${fR(x.oosAvg)} over ${x.oosN}, quarters +${x.qp}/${x.qa}${x.rob ? ', robust' : ''}` : '';
  L.push(`GOLDMINE BACKTEST LAB · ${LAB.sym} · ${new Date().toISOString().slice(0, 10)}`, '', 'DATA');
  for (const tf of LAB.tfs) { const D = LAB.D[tf]; L.push(`- ${tf}: ${fN(D.n)} candles ${iso(D.from).slice(0, 10)} → ${iso(D.to).slice(0, 10)}, ${D.trades.length} trades (${D.kills} filled-and-stopped), median spread ${D.sprMed} pts`) }
  L.push(`TR settings: range ≥ ${LAB.cfg.minBars} candles, size ${LAB.cfg.rangeAtr}× ATR, stop buffer ${LAB.cfg.slBuf}× ATR, wait ≤ ${LAB.cfg.maxAge}, ${LAB.cfg.away ? 'leave zone first' : 'no leave rule'}. Costs: ${OPT.cost}${OPT.comm ? ', commission ' + OPT.comm + ' per lot' : ''}.`);
  if (LAB.focus) L.push(`Deep test of a finder setting: ${LAB.focus.desc}`);
  L.push('', 'RECOMMENDATION'); if (b) { L.push(`${b.tf} ${gLabel(b.g)} (${fLabel(b.f)}) · exit: ${planLabel(LAB.D[b.tf].plans[b.p])}`, P(b, 'Result')); howTo(b).st.forEach(s => L.push('- ' + s.replace(/<[^>]+>/g, ''))) }
  L.push('', 'TOP ROBUST SETUPS (timeframe · signals · filter · exit → stats)'); topList(15).forEach((x, i) => L.push(`${i + 1}. ${x.tf} · ${gLabel(x.g)} · ${x.f === 'all' ? 'no filter' : 'with ' + x.f.slice(3)} · ${planLabel(LAB.D[x.tf].plans[x.p])} → ${P(x, 'stats')}`));
  L.push('', 'INSIGHTS'); insights().forEach(i => L.push(`- ${i.t}${i.imp ? ' (' + i.imp + ')' : ''}: ${i.p}`));
  if (b) { const pl = LAB.D[b.tf].plans[b.p]; L.push('', `BREAKEVEN / TRAILING (${b.tf} ${gLabel(b.g)}, TP ${pl.tp.l})`); for (const sm of SMS) { const x = getC(b.tf, b.g, b.f, `${pl.tp.id}|${sm.id}|${pl.pt.id}`); if (x) L.push(`- ${sm.l}: ${P(x, 'stats')}`) } }
  try { const c = scaleCfg(), B = c && scaleBase(c); if (B) { L.push('', `SCALING IN (parent ${c.H} ${gLabel(c.gP)} · ${planLabel(planOf(c.H, c.pKey))}; adds from ${c.Ls.join(', ')})`); for (const v of SVARS) { const x = campEval(B, v); L.push(`- ${v.l}: total ${fR(x.sum, 1)}, max DD −${x.dd.toFixed(1)}R, ${x.addsPer.toFixed(2)} adds per trade, ${fR(x.kAvg)} per add`) } } } catch {}
  L.push('', 'METHOD: costs per candle (MT5 spread) + commission, buys pay the ask, sells exit on the ask, stop first on doubtful candles, breakeven from the next candle, filled-and-stopped candles = −1R, robust = also positive on the unseen last ' + OPT.oos + '% and most quarters.');
  return L.join('\n');
}
async function copySummary() { const t = summaryText(); try { await navigator.clipboard.writeText(t); toast('Summary copied: paste it into your AI chat', 'ok', 6000) } catch { dl(`goldmine-lab-summary-${LAB.sym}-${stamp()}.txt`, t, 'text/plain'); toast('Clipboard blocked: the summary was downloaded as a text file', 'warn', 6000) } }
function focusCard() {
  const fo = LAB.focus; if (!fo || !LAB.D[fo.tf]) return '';
  const beK = fo.be ? ({ 1: 'be1', 1.5: 'be15', 2: 'be2' })[fo.be] || 'fix' : 'fix', base = getC(fo.tf, fo.g, 'all', `r${fo.tp}|${beK}|p0`), b = LAB.best, d = base && b ? b.avg - base.avg : 0, F = fo.finder;
  return `<div class="card focuscard"><div class="lab">🔍 Your setting from the finder</div><h3>${esc(fo.desc || fo.tf)}</h3>
    <div class="cols3"><div><small>In the finder</small><b>${F ? fR(F.avg) : '—'}</b><span>${F ? `${F.n} trades · win ${F.win.toFixed(0)}% · unseen ${fR(F.bavg)}` : ''}</span></div>
      <div><small>Same exit here (precise fills)</small><b>${base ? fR(base.avg) : '—'}</b><span>${base ? `${base.n} trades · win ${fP(base.win)} · unseen ${fR(base.oosAvg)}` : 'exit not tested here'}</span></div>
      <div class="hl"><small>Best exit found for it</small><b class="${d > 0 ? 'up' : ''}">${b ? fR(b.avg) : '—'}</b><span>${b ? esc(planLabel(LAB.D[b.tf].plans[b.p])) + (b.f !== 'all' ? ' · ' + esc(fLabel(b.f)) : '') : ''}${base && b ? ` · ${d >= 0 ? '+' : '−'}${Math.abs(d).toFixed(2)}R per trade vs the finder exit` : ''}</span></div></div>
    <p class="note">Small differences with the finder are normal: here higher-timeframe trades are replayed on smaller candles (precise fills) and gaps through the stop fill at the open.</p></div>`;
}

/* ---------- send a result to the terminal ---------- */
async function saveSystem(tf, g, f, key) {
  const pl = planOf(tf, key); if (!pl) return;
  // the whole plan goes into the system: the terminal's TR settings and the 🤖 bot follow every part of it (see TR_DEF in terminal_pro.html)
  const exit = { tpMode: pl.tp.k === 'R' ? 'R' : pl.tp.k === 'none' ? 'none' : pl.tp.k, tpTf: (pl.tp.k === 'zone' || pl.tp.k === 'sig') && pl.tp.z !== tf ? pl.tp.z : '', tp: pl.tp.k === 'R' ? pl.tp.r : 0,
    beR: pl.sm.k === 'be' ? pl.sm.r : 0, trail: pl.sm.k === 'trail', partR: pl.pt.k === 'part' ? pl.pt.r : 0, partPct: pl.pt.k === 'part' ? Math.round(pl.pt.pct * 100) : 50, filt: f.startsWith('al:') ? f.slice(3) : '', zMin: OPT.zoneMin, zFb: OPT.zoneFb };
  const cfg = { ...LAB.cfg, ...exit, show: g === '1' ? 'tr1' : g === '2' ? 'tr2' : g === '12' ? 'both' : 'all' };
  const extra = [g === '3' ? 'The terminal cannot show only TR3+: the system shows all TR signals.' : '', f.startsWith('ag:') ? `The “against ${f.slice(3)}” filter is not part of a TR system: check it yourself before each trade.` : ''].filter(Boolean).join(' ');
  const v = await formBox('Save as a TR system', [{ id: 'name', label: 'Name', value: `${LAB.sym} ${tf} ${gLabel(g)} ${pl.tp.k === 'R' ? pl.tp.r + 'R' : pl.tp.s}`.trim(), text: true }], 'Save system', esc(`${tf} · ${gLabel(g)} · ${planLabel(pl)}${exit.filt ? ' · only with ' + exit.filt + ' structure' : ''}. The 🤖 auto-trade bot follows all of it. ${extra}`));
  if (!v || !v.name) return;
  TRP = store.get('trPresets', []); const name = v.name.slice(0, 40), keep = ['minBars', 'rangeAtr', 'slBuf', 'away', 'tp', 'show', 'maxAge', ...Object.keys(exit)], c2 = Object.fromEntries(keep.map(k => [k, cfg[k]])), old = TRP.find(x => x.name.toLowerCase() === name.toLowerCase());
  if (old) Object.assign(old, { cfg: c2, tf, saved: Date.now() }); else TRP.push({ id: Date.now().toString(36), name, cfg: c2, tf, saved: Date.now() });
  store.set('trPresets', TRP); toast(`Saved “${name}”. In the terminal: TR panel → system menu.`, 'ok', 6000);
}
async function setAuto(tf, key) {
  const pl = planOf(tf, key); if (!pl) return; const sym = LAB.sym, A = store.get('auto', {}), old = A[sym] || {};
  const next = { trail: old.trail || 0, beR: pl.sm.k === 'be' ? pl.sm.r : 0, partR: pl.pt.k === 'part' ? pl.pt.r : 0, partPct: pl.pt.k === 'part' ? Math.round(pl.pt.pct * 100) : old.partPct || 50 };
  const ok = await confirmBox(`Automation for ${sym}`, `<p>The terminal will ${next.beR ? `move the stop to breakeven at <b>${next.beR}R</b>` : 'not move stops to breakeven'}${next.partR ? ` and close <b>${next.partPct}% at ${next.partR}R</b>` : ''}.</p><p style="margin-top:8px">This works on <b>every</b> open ${esc(sym)} position (also the ones you open by hand) while the terminal is open. You can change it in the terminal: Manage → Automation for this symbol.</p>`, 'Save automation');
  if (!ok) return; A[sym] = next; store.set('auto', A); toast(`Automation saved for ${sym}`, 'ok');
}

/* ---------- boot ---------- */
// the lab has its own theme (default: the dark "Night" brand look); it never changes the terminal's theme
const setLabTheme = t => { document.documentElement.dataset.theme = t; $$('#themeSeg button').forEach(x => x.classList.toggle('on', x.dataset.th === t)) };
setLabTheme(new URLSearchParams(location.search).get('theme') || store.get('labTheme', 'midnight'));
document.addEventListener('click', e => { const b = e.target.closest('[data-th]'); if (!b) return; store.set('labTheme', b.dataset.th); setLabTheme(b.dataset.th); render() });
$('#acctSel').addEventListener('change', async e => { LAB.login = +e.target.value; await loadSymbols(); render() }); // only for this page: candles never make the bridge switch accounts
$('#symSel').addEventListener('change', e => { LAB.symbol = e.target.value; store.set('labSymbol', LAB.symbol); render() });
async function loadSymbols() {
  const s = await api(`/api/symbols?login=${LAB.login}`); LAB.symbols = s.symbols || [];
  if (!LAB.symbols.includes(LAB.symbol)) LAB.symbol = (s.gold || [])[0] || LAB.symbols[0] || 'XAUUSD';
  $('#symSel').innerHTML = LAB.symbols.map(x => `<option ${x === LAB.symbol ? 'selected' : ''}>${esc(x)}</option>`).join('');
}
async function boot() {
  const ho = takeHandoff(); render();
  try {
    if (!CFG.demo && !CFG.key) throw new Error('No bridge key yet: open the terminal, connect once, then come back to this page.');
    const a = await api('/api/accounts'); LAB.accounts = a.accounts || [];
    if (!LAB.accounts.some(x => x.login === LAB.login)) LAB.login = LAB.accounts[0]?.login || 0;
    $('#acctSel').innerHTML = LAB.accounts.map(x => `<option value="${x.login}" ${x.login === LAB.login ? 'selected' : ''}>${esc(x.name)} · ${x.login}</option>`).join('');
    await loadSymbols();
  } catch (e) { LAB.err = e.message; if (!$('#symSel').innerHTML) $('#symSel').innerHTML = `<option>${esc(LAB.symbol)}</option>` }
  await refreshSaved(); render();
  if (ho && (!LAB.err || OPT.source === 'files')) runLab(); // straight from the settings finder: test it right away
}
addEventListener('storage', e => { if (e.key === SP + 'trPresets') TRP = store.get('trPresets', []) });
boot();
